[package]
name = "awsw"
version = "0.2.0"
edition = "2021"
description = "AWS Profile Switcher - manage multiple AWS profiles with ease"

[dependencies]
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.15"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "macros"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "awsw"
path = "src/main.rs"
