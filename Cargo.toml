[package]
name = "awsw-bin"
version = "0.1.0"
edition = "2021"
description = "AWS Profile Switcher - manage multiple AWS profiles with ease"

[dependencies]
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.15"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
